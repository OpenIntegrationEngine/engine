services:
  oie:
    build:
      context: ..
      dockerfile: Dockerfile.rebase-alpine
      args:
        OIE_IMAGE: ${OIE_IMAGE}
        JRE_IMAGE: eclipse-temurin:21.0.9_10-jre-alpine
    ports:
      - "8443:8443"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8443'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 40s
