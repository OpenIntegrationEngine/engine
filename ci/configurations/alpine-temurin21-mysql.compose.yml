services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: mirthdb
      MARIADB_USER: mirthdb
      MARIADB_PASSWORD: mirthdb
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -umirthdb -pmirthdb
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s

  oie:
    image: ${OIE_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE: mysql
      DATABASE_URL: jdbc:mysql://db:3306/mirthdb
      DATABASE_USERNAME: mirthdb
      DATABASE_PASSWORD: mirthdb
      DATABASE_MAX_CONNECTIONS: 20
      DATABASE_MAX_RETRY: 10
      DATABASE_RETRY_WAIT: 5000
    ports:
      - "8443:8443"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8443'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 40s
