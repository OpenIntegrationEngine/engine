services:
  db:
    platform: linux/amd64
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: OieOraclePassw0rd!
      APP_USER: mirthdb
      APP_USER_PASSWORD: mirthdb
    healthcheck:
      test:
        - CMD-SHELL
        - healthcheck.sh
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  oie:
    image: ${OIE_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE: oracle
      DATABASE_URL: jdbc:oracle:thin:@//db:1521/FREEPDB1
      DATABASE_USERNAME: mirthdb
      DATABASE_PASSWORD: mirthdb
      DATABASE_MAX_CONNECTIONS: 20
      DATABASE_MAX_RETRY: 20
      DATABASE_RETRY_WAIT: 5000
    ports:
      - "8443:8443"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8443'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 40s