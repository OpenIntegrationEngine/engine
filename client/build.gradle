def clientExtensionJars = clientExtensions.collect { name, pkg ->
    tasks.register("ext_${name.replace('-', '_')}_clientJar", Jar) {
        archiveFileName = "${name}-client.jar"
        destinationDirectory = file("dist/extensions/${name}")
        from(sourceSets.main.output.classesDirs) {
            include "${pkg}/**"
        }
    }
}

assemble.dependsOn clientJar
assemble.dependsOn clientExtensionJars

// Runs the Swing administrator client against a local server (flags
// preserved from the retired Eclipse launch configuration).
tasks.register('devClient', JavaExec) {
    description = 'Runs the administrator client against https://localhost:8443 (admin/admin).'
    mainClass = 'com.mirth.connect.client.ui.Mirth'
    workingDir = projectDir
    classpath = sourceSets.main.runtimeClasspath
    args 'https://localhost:8443', '0.0.0', 'admin', 'admin'
    jvmArgs '-Dcom.sun.webkit.useHTTP2Loader=false',
            '--add-modules=java.sql.rowset,javafx.controls,javafx.fxml',
            '--add-exports=java.base/com.sun.crypto.provider=ALL-UNNAMED',
            '--add-exports=java.base/sun.security.provider=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.math=ALL-UNNAMED',
            '--add-opens=java.base/java.net=ALL-UNNAMED',
            '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/java.security=ALL-UNNAMED',
            '--add-opens=java.base/java.security.cert=ALL-UNNAMED',
            '--add-opens=java.base/java.text=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
            '--add-opens=java.base/sun.security.pkcs=ALL-UNNAMED',
            '--add-opens=java.base/sun.security.rsa=ALL-UNNAMED',
            '--add-opens=java.base/sun.security.x509=ALL-UNNAMED',
            '--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED',
            '--add-opens=java.desktop/com.apple.eio=ALL-UNNAMED',
            '--add-opens=java.desktop/java.awt=ALL-UNNAMED',
            '--add-opens=java.desktop/java.awt.color=ALL-UNNAMED',
            '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
            '--add-opens=java.desktop/javax.swing=ALL-UNNAMED',
            '--add-opens=java.xml/com.sun.org.apache.xalan.internal.xsltc.trax=ALL-UNNAMED'
}

clean {
    delete 'classes', 'test_classes', 'dist', 'setup', 'logs'
}
