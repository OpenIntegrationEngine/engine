// The Swing administrator client. Produces dist/mirth-client.jar and the
// per-extension client jars in dist/extensions (mirrors client/ant-build.xml).

dependencies {
    implementation libs.bundles.client.main
    // Extension libs from the server tree may carry client-side deps.
    implementation libs.bundles.server.extensions
    implementation fileTree(dir: rootProject.file('server/lib/extensions'), include: '**/*.jar')
    testImplementation libs.bundles.server.test
}

def prepareClientLibs = tasks.register('prepareClientLibs', Copy) {
    description = 'Copies upstream jars into client/lib (mirrors mirth-build build-server-extensions/build-client).'
    from rootProject.file('donkey/setup/donkey-model.jar')
    from rootProject.file('server/setup/server-lib/mirth-client-core.jar')
    from rootProject.file('server/setup/server-lib/mirth-crypto.jar')
    from rootProject.file('server/lib/mirth-vocab.jar')
    from(rootProject.file('server/build/extensions')) {
        include '**/*-shared.jar'
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into 'lib'
    dependsOn ':donkey:donkeyModelJar', ':server:clientCoreJar', ':server:cryptoJar',
              ':server:createServerExtensions'
}

compileJava.dependsOn prepareClientLibs

def clientJar = tasks.register('clientJar', Jar) {
    archiveFileName = 'mirth-client.jar'
    destinationDirectory = file('dist')
    from(sourceSets.main.output.classesDirs) {
        exclude 'com/mirth/connect/connectors/**'
    }
    from(sourceSets.main.output.classesDirs) {
        include 'com/mirth/connect/connectors/ConnectorClass.class'
    }
    // Resources the Ant build copied into the classes dir before jarring.
    from 'src/main/resources/log4j2.properties'
    from('src/main/resources/com/mirth/connect/client/ui/images') {
        into 'com/mirth/connect/client/ui/images'
    }
    from('src/main/resources/com/mirth/connect/client/ui/components/rsta') {
        include '*.properties'
        into 'com/mirth/connect/client/ui/components/rsta'
    }
    from('src/main/resources/com/mirth/connect/client/ui/components/tag') {
        include '*.html'
        include '*.css'
        include '*.js'
        into 'com/mirth/connect/client/ui/components/tag'
    }
}

