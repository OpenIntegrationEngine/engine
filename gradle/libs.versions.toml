# Dependency versions for every module. Resolution is non-transitive
# (see build.gradle), so every Maven Central artifact the build uses is
# listed here, including ones that would normally arrive transitively.
# Jars with no Maven Central match stay vendored in each module's lib/.
#
# Originally generated by SHA-1 matching the vendored jars against Maven
# Central; versions have since moved on, mostly for security fixes.
# gradle/verification-metadata.xml enforces checksums (regenerate it with
# a cold cache after any change here, see CONTRIBUTING.md), and
# gradle/vendored-layout.json places each artifact in the distribution.

[versions]
# Shared by artifacts released together; bump the whole family at once.
asm = "9.6"
awssdk = "2.15.28"
bouncycastle = "1.78.1"
byte-buddy = "1.14.13"
derby = "10.10.2.0"
flying-saucer = "9.0.1"
hapi = "2.3"
hk2 = "2.4.0-b31"
httpclient = "4.5.13"
itext = "2.1.7"
# do not bump past 2.15.x before reading the note on jackson-core
jackson = "2.14.3"
jasper = "8.5.70"
jaxb-ri = "2.4.0-b180725.0644"
jaxws-ri = "2.3.0.2"
jersey = "2.22.1"
jetty = "9.4.57.v20241219"
