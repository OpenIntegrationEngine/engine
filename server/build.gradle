// ---------------------------------------------------------------------
// Javadocs (user API), part of the distributed docs
// ---------------------------------------------------------------------

// Invokes the javadoc tool directly: the multiline -bottom argument
// (whitespace from the old build.xml CDATA block) cannot pass through
// Gradle's javadoc options file, and the generated HTML should be
// identical to the Ant build's.
def userApiJavadoc = tasks.register('userApiJavadoc') {
    description = 'Generates the user API javadocs into docs/javadocs/user-api.'
    def outDir = file('docs/javadocs/user-api')
    inputs.files(fileTree('src/main/java') {
        include 'com/mirth/connect/server/userutil/**'
        include 'com/mirth/connect/userutil/**'
        include 'com/mirth/connect/plugins/httpauth/userutil/**'
    })
    outputs.dir outDir
    dependsOn syncDonkeyLibs
    doLast {
        outDir.mkdirs()
        def cmd = [new File(System.getProperty('java.home'), 'bin/javadoc').absolutePath,
                   '-d', outDir.absolutePath,
                   '-notimestamp',
                   '-classpath', (configurations.compileClasspath + fileTree(dir: 'lib', include: '**/*.jar')).asPath,
                   '-sourcepath', file('src/main/java').absolutePath,
                   '-link', 'https://docs.oracle.com/en/java/javase/17/docs/api/',
                   '-bottom', '\n\t\t\t\tLicensed under the <a href="https://www.mozilla.org/MPL/2.0/">Mozilla Public License 2.0</a>.\n\t\t\t',
                   '--add-modules=java.sql.rowset',
                   '--add-exports=java.sql.rowset/com.sun.rowset=ALL-UNNAMED',
                   'com.mirth.connect.server.userutil',
                   'com.mirth.connect.userutil',
                   'com.mirth.connect.plugins.httpauth.userutil']
        def proc = new ProcessBuilder(cmd).redirectErrorStream(true).start()
        def out = proc.inputStream.text
        if (proc.waitFor() != 0) {
            throw new GradleException("javadoc failed:\n${out}")
        }
    }
}

// ---------------------------------------------------------------------
// Setup assembly (the distribution tree in setup/)
// ---------------------------------------------------------------------

// Many sources merge into the shared setup/ tree, the way the Ant
// create-setup target assembled it. A single untracked staging task does
// those copies; the jars below keep precise tracked outputs.
def stageSetup = tasks.register('stageSetup') {
    description = 'Stages libs, conf, html, extensions, docs, and module artifacts into server/setup.'
    dependsOn syncDonkeyLibs, createServerExtensions, userApiJavadoc,
              ':client:assemble', ':client:prepareClientLibs', ':client:writeArtifactInventory',
              ':command:cliJar', ':command:cliLauncherJar', ':command:prepareCliLibs',
              ':command:writeArtifactInventory'
    outputs.upToDateWhen { false }
    doLast {
        project.delete('setup/appdata')
        ['conf', 'extensions', 'public_html', 'public_api_html', 'server-lib', 'client-lib',
         'cli-lib', 'logs', 'docs', 'server-launcher-lib'].each { file("setup/${it}").mkdirs() }

        // sync (not copy) so files that disappear from the sources also
        // disappear from setup/ on incremental builds; the Ant build got the
        // same effect by always cleaning first. preserve{} protects the jars
        // that other tasks produce directly into these directories.
        def serverPlacements = rootProject.stagedArtifacts(configurations.runtimeClasspath, 'server')
        sync { s ->
            s.from('lib') {
                exclude 'ant/**'
                exclude 'extensions/**'
            }
            s.from(files({ serverPlacements().keySet() })) {
                eachFile { it.path = serverPlacements()[it.file] }
                includeEmptyDirs = false
            }
            s.into 'setup/server-lib'
            s.preserve { p ->
                p.include 'mirth-crypto.jar'
                p.include 'mirth-client-core.jar'
                p.include 'mirth-server.jar'
                p.include 'mirth-dbconf.jar'
            }
        }
        sync { s ->
            s.into 'setup/conf'
            s.from 'conf'
            s.from(rootProject.file('command/conf')) {
                include 'mirth-cli-config.properties'
                include 'log4j2-cli.properties'
            }
        }
        sync { s ->
            s.from('public_html') { exclude 'Thumbs.db' }
            s.into 'setup/public_html'
        }
        ant.replace(dir: 'setup/public_html', includes: '*.html',
                token: '@mirthversion', value: projectVersion)
        sync { s ->
            s.from('public_api_html') { exclude 'Thumbs.db' }
            s.into 'setup/public_api_html'
        }
        sync { s ->
            // build/extensions may still hold client jars from a previous
            // build's final copy-back; the fresh client output wins.
            s.duplicatesStrategy = DuplicatesStrategy.INCLUDE
            s.from 'build/extensions'
            s.from rootProject.file('client/dist/extensions')
            s.into 'setup/extensions'
        }
        sync { s ->
            s.from 'docs'
            s.into 'setup/docs'
        }
        // setup root holds files from several producers; plain copies here.
        copy {
            into 'setup'
            from('basedir-includes') {
                exclude 'oieserver'
                exclude 'configure-from-env'
            }
            from('basedir-includes') {
                include 'oieserver'
                include 'configure-from-env'
                filePermissions { unix('0755') }
            }
        }

        // mirth-build.xml build-client / build-cli: client and CLI artifacts
        def clientPlacements = rootProject.stagedFromInventory(
                rootProject.file('client/build/placement/artifacts.json'), 'client')
        sync { s ->
            s.into 'setup/client-lib'
            s.from rootProject.file('client/dist/mirth-client.jar')
            s.from(rootProject.file('client/lib')) {
                exclude '*-shared.jar'
                exclude 'extensions'
            }
            s.from(files({ clientPlacements().keySet() })) {
                eachFile { it.path = clientPlacements()[it.file] }
                includeEmptyDirs = false
            }
            s.preserve { p ->
                p.include 'userutil-sources.jar'
            }
        }
        def cliPlacements = rootProject.stagedFromInventory(
                rootProject.file('command/build/placement/artifacts.json'), 'command')
        sync { s ->
            s.into 'setup/cli-lib'
            s.from rootProject.file('command/build/mirth-cli.jar')
            s.from(rootProject.file('command/lib')) {
                exclude 'mirth-client.jar'
            }
            s.from(files({ cliPlacements().keySet() })) {
                eachFile { it.path = cliPlacements()[it.file] }
                includeEmptyDirs = false
            }
        }
        copy {
            from rootProject.file('command/build/mirth-cli-launcher.jar')
            into 'setup'
        }
    }
}

