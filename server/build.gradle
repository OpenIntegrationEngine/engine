// The OIE server. Compiles the server source, builds the core jars
// (mirth-crypto, mirth-client-core, mirth-server, launcher, dbconf),
// builds every connector/plugin extension into build/extensions,
// assembles the distribution in setup/, and zips extensions into dist/
// (mirrors server/build.xml).

import java.text.SimpleDateFormat

dependencies {
    implementation libs.bundles.server.main
    implementation libs.bundles.server.extensions
    // classified artifact; version catalogs cannot express classifiers
    implementation 'io.netty:netty-transport-native-epoll:4.1.135.Final:linux-x86_64'
    testImplementation libs.bundles.server.test
}

// ---------------------------------------------------------------------
// Compilation
// ---------------------------------------------------------------------

// build-donkey in mirth-build.xml: refresh lib/donkey from the donkey
// module. Sources donkey's staged setup/lib, which reassembles the full
// historical lib layout from vendored leftovers + resolved artifacts.
def syncDonkeyLibs = tasks.register('syncDonkeyLibs', Sync) {
    description = 'Copies donkey jars and libs into server/lib/donkey.'
    into 'lib/donkey'
    from rootProject.file('donkey/setup/donkey-model.jar')
    from rootProject.file('donkey/setup/donkey-server.jar')
    from(rootProject.file('donkey/setup/lib')) {
        exclude 'log4j-1.2.16.jar'
        exclude 'HikariCP-java6-2.0.1.jar'
        exclude 'javassist-3.19.0-GA.jar'
        exclude 'xstream/**'
        exclude 'commons/**'
        exclude 'database/**'
    }
    dependsOn ':donkey:donkeyModelJar', ':donkey:donkeyServerJar', ':donkey:copySetupLibs'
}

compileJava.dependsOn syncDonkeyLibs

compileTestJava {
    options.compilerArgs += [
        '--add-modules=java.sql.rowset',
        '--add-exports=java.sql.rowset/com.sun.rowset=ALL-UNNAMED',
        '--add-exports=java.base/com.sun.crypto.provider=ALL-UNNAMED',
        '--add-exports=java.base/sun.security.provider=ALL-UNNAMED',
    ]
}


def generateVersionProperties = tasks.register('generateVersionProperties') {
    description = 'Generates version.properties (embedded in mirth-client-core.jar).'
    def outFile = file('version.properties')
    inputs.property 'version', version
    // the date must be computed at execution time, not when the daemon
    // happened to configure the project
    inputs.property 'date', project.providers.provider {
        new SimpleDateFormat('MMMM d, yyyy', Locale.US).format(new Date())
    }
    outputs.file outFile
    doLast {
        def buildDate = new SimpleDateFormat('MMMM d, yyyy', Locale.US).format(new Date())
        outFile.text = "mirth.version=${version}\nmirth.date=${buildDate}\n"
    }
}

// ---------------------------------------------------------------------
// Core jars
// ---------------------------------------------------------------------

def cryptoJar = tasks.register('cryptoJar', Jar) {
    archiveFileName = 'mirth-crypto.jar'
    destinationDirectory = file('setup/server-lib')
    from(sourceSets.main.output.classesDirs) {
        include 'com/mirth/commons/encryption/**'
    }
}

def clientCoreJar = tasks.register('clientCoreJar', Jar) {
    archiveFileName = 'mirth-client-core.jar'
    destinationDirectory = file('setup/server-lib')
    from(sourceSets.main.output.classesDirs) {
        include 'com/mirth/connect/client/core/**'
        include 'com/mirth/connect/model/**'
        include 'org/openintegrationengine/engine/plugins/datatypes/AbstractXMLReader.class'
        include 'com/mirth/connect/userutil/**'
        include 'com/mirth/connect/util/**'
        include 'com/mirth/connect/server/util/ResourceUtil.class'
        include 'com/mirth/connect/server/util/DebuggerUtil.class'
        include 'org/mozilla/**'
        include 'org/glassfish/jersey/**'
        include 'de/**'
        include 'net/lingala/zip4j/unzip/**'
    }
    from generateVersionProperties
    from('src/main/resources/com/mirth/connect/util') {
        include '*.js'
        include '*.txt'
        into 'com/mirth/connect/util'
    }
}

