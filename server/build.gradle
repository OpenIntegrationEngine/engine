     server: null],
]

def extensionTasks = []
def projectVersion = version

serverExtensions.each { extension ->
    def name = extension.name
    def safe = name.replace('-', '_')
    def extensionDir = "build/extensions/${name}"

    extensionTasks << tasks.register("ext_${safe}_xml", Copy) {
        // The replaced version is part of the output; without this input a
        // version bump would leave stale @mirthversion XML on disk.
        inputs.property 'version', projectVersion
        from("src/main/resources/${extension.pkg}") { include '*.xml' }
        into extensionDir
        // In-place token replace after copying, like the Ant <replace>
        // task; a content filter would normalize line endings.
        doLast {
            ant.replace(dir: extensionDir, includes: '*.xml',
                    token: '@mirthversion', value: projectVersion)
        }
    }

    def libPrefix = "extensions/${extension.lib}"
    def extPlacements = rootProject.stagedArtifacts(configurations.runtimeClasspath, 'server-extensions',
            { dir -> dir == libPrefix || dir.startsWith(libPrefix + '/') })
    extensionTasks << tasks.register("ext_${safe}_lib", Copy) {
        from "lib/extensions/${extension.lib}"
        from(files({ extPlacements().keySet() })) {
            eachFile { it.path = extPlacements()[it.file].substring(libPrefix.length() + 1) }
            includeEmptyDirs = false
        }
        into "${extensionDir}/lib"
    }

    if (extension.shared != null) {
        extensionTasks << tasks.register("ext_${safe}_sharedJar", Jar) {
            archiveFileName = "${name}-shared.jar"
            destinationDirectory = file(extensionDir)
            from(sourceSets.main.output.classesDirs) {
                include(extension.shared.includes as String[])
                exclude((extension.shared.excludes ?: []) as String[])
            }
        }
    }

    if (extension.server != null) {
        extensionTasks << tasks.register("ext_${safe}_serverJar", Jar) {
            archiveFileName = "${name}-server.jar"
            destinationDirectory = file(extensionDir)
            from(sourceSets.main.output.classesDirs) {
                include(extension.server.includes as String[])
                exclude((extension.server.excludes ?: []) as String[])
            }
        }
    }
}

