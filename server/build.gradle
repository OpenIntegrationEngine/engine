// ---------------------------------------------------------------------
// Jar signing (Java Web Start). Same signing inputs and manifest
// mutation as the Ant create-setup target; differences: sequential
// rather than 4-thread signing, the -certchain argument for the CA
// path, and a fail-fast retry that protects hardware tokens.
// ---------------------------------------------------------------------

def signSetupJars = tasks.register('signSetupJars') {
    description = 'Adds JWS manifest attributes and signs the client-lib and extension jars.'
    dependsOn setupContent
    onlyIf { !rootProject.disableSigning }
    outputs.upToDateWhen { false }
    doLast {
        def manifestJars = fileTree('setup/client-lib') {
            include '**/*.jar'
            exclude 'bcp*.jar'
            exclude 'bcutil*.jar'
        } + fileTree('setup/extensions') { include '**/*.jar' }

        logger.lifecycle 'Modifying jar manifests to add JWS permission attributes'
        def manifestPath = file('custom_manifest.mf').absolutePath
        manifestJars.each { jarFile ->
            // ProcessBuilder rather than exec(Closure): the latter is
            // removed in Gradle 9
            def proc = new ProcessBuilder('jar', 'umf', manifestPath, jarFile.absolutePath)
                    .redirectErrorStream(true).start()
            def out = proc.inputStream.text
            if (proc.waitFor() != 0) {
                throw new GradleException("jar umf failed for ${jarFile.name}: ${out}")
            }
        }

        def keystoreFile = providers.gradleProperty('keystore_property_file').getOrNull()
                ?: 'keystore.properties'
        def keystoreProps = new Properties()
        file(keystoreFile).withInputStream { keystoreProps.load(it) }
        // Property precedence: a -P project property on the command line wins
        // over (or supplies a missing) value from the properties file. The
        // YubiKey workflow relies on this for the PIN (-Pkey.storepass=...).
        def signingProp = { String name ->
            providers.gradleProperty(name).getOrNull() ?: keystoreProps.getProperty(name)
        }
        def tsa = signingProp('signingTsa') ?: 'http://timestamp.digicert.com'

        if (!signingProp('key.storepass')) {
            throw new GradleException("key.storepass is not set; add it to ${keystoreFile} " +
                    'or pass it on the command line as -Pkey.storepass=...')
        }

        def signJars = fileTree('setup/client-lib') { include '**/*.jar' } +
                       fileTree('setup/extensions') { include '**/*.jar' }

        // Retries exist for transient TSA failures (Ant used retrycount=5,
        // i.e. up to 6 attempts). A failure on the very first jar means a bad
        // PIN/passphrase/config, and retrying a wrong PIN against a hardware
        // token can permanently block it, so fail fast until one jar has
        // signed successfully.
        boolean configProven = false
        def withRetry = { Closure work ->
            int attempts = 0
            while (true) {
                try {
                    work()
                    configProven = true
                    return
                } catch (Exception e) {
                    attempts++
                    if (!configProven || attempts > 5) {
                        throw e
                    }
                    logger.warn "signjar failed (attempt ${attempts}), retrying: ${e.message}"
                    Thread.sleep(1000)
                }
            }
        }

        if (signingProp('cert') == 'ca') {
            logger.lifecycle 'Signing with CA certificate'
            signJars.each { jarFile ->
                withRetry {
                    ant.signjar(jar: jarFile.absolutePath,
                            alias: signingProp('key.alias'),
                            storepass: signingProp('key.storepass'),
                            storetype: signingProp('key.storetype'),
                            providerclass: signingProp('key.providerclass'),
                            providerarg: signingProp('key.providerarg'),
                            tsaurl: tsa) {
                        arg(value: '-certchain')
                        arg(value: signingProp('key.certchain'))
                        sysproperty(key: 'jsse.enableSNIExtension', value: 'false')
                        sysproperty(key: 'https.protocols', value: 'TLSv1.2,TLSv1.1')
                    }
                }
            }
        } else {
            logger.lifecycle 'Signing with self-signed certificate'
            signJars.each { jarFile ->
                withRetry {
                    ant.signjar(jar: jarFile.absolutePath,
                            alias: signingProp('key.alias'),
                            keystore: signingProp('key.keystore'),
                            storepass: signingProp('key.storepass'),
                            keypass: signingProp('key.keypass'),
                            storetype: signingProp('key.storetype'),
                            tsaurl: tsa,
                            digestalg: 'SHA-256') {
                        sysproperty(key: 'jsse.enableSNIExtension', value: 'false')
                        sysproperty(key: 'https.protocols', value: 'TLSv1.2,TLSv1.1')
                    }
                }
            }
        }
    }
}

def createSetup = tasks.register('createSetup') {
    group = 'build'
    description = 'Assembles the full distribution tree in server/setup.'
    dependsOn setupContent, signSetupJars, ':verifyVendoredParity'
}

