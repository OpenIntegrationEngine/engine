def launcherJar = tasks.register('launcherJar', Jar) {
    archiveFileName = 'mirth-server-launcher.jar'
    destinationDirectory = file('setup')
    from(sourceSets.main.output.classesDirs) {
        include 'com/mirth/connect/server/launcher/**'
        include 'com/mirth/connect/server/extprops/**'
    }
    manifest {
        attributes('Main-Class': 'com.mirth.connect.server.launcher.MirthLauncher')
    }
    // The Class-Path entries are generated from the resolved dependency
    // versions so a catalog bump cannot leave the manifest stale (the
    // Ant build hardcoded these and required a manual edit per bump).
    def launcherDeps = ['commons-io', 'commons-configuration2', 'commons-lang3',
                        'commons-logging', 'commons-beanutils', 'commons-text',
                        'commons-collections']
    doFirst {
        def byModule = [:]
        configurations.runtimeClasspath.incoming.artifacts.each { a ->
            def id = a.id.componentIdentifier
            if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                byModule[id.module] = a.file.name
            }
        }
        manifest.attributes['Class-Path'] = launcherDeps.collect { m ->
            def jar = byModule[m]
            if (jar == null) {
                throw new GradleException("launcher Class-Path dependency '${m}' not resolved")
            }
            "server-lib/commons/${jar}"
        }.join(' ') + ' conf/'
    }
}

