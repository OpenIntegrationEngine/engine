// Integration ("smoke") tests that run against a live OIE server started by
// ci/runtests.sh. They are not unit tests and are deliberately absent from the
// root build/test/clean aggregates: `./gradlew build` (including the one inside
// the Dockerfile builder stage) must never try to reach a server.

apply plugin: 'distribution'

apply from: 'generate-smoke-tests.gradle'

// The harness runs with the server's whole staged distribution
def stagedServer = files([
        project(':server').fileTree('setup/server-lib') { include '**/*.jar' },
        project(':server').fileTree('setup/extensions') { include '**/*.jar' }]) {
    builtBy ':server:createSetup'
}

dependencies {
    testCompileOnly stagedServer

    testImplementation libs.junit.platform.console.standalone
}

def generateSmokeTests = tasks.named('generateSmokeTests')

sourceSets {
    test {
        java.srcDir(generateSmokeTests.flatMap { it.generatedSources })
        resources.srcDir(generateSmokeTests.flatMap { it.generatedResources })
    }
}

// match ci/run-harness.sh, sort is critical
def engineHome = project(':server').file('setup')
def engineJars = files({
    fileTree(engineHome) {
        include 'extensions/**/*.jar'
        include 'server-lib/**/*.jar'
    }.files.sort { it.path }
})

// The root convention applies useJUnit() to every Test task; this module is JUnit 5.
tasks.named('test') {
    useJUnitPlatform()
    // Only run our tests if a live server URL is provided
    // `./gradlew :smoketest:test -Doie.baseUrl=https://localhost:8443`
    onlyIf { System.getProperty('oie.baseUrl') != null }
    // The thing under test is a running server, no incremental build is possible.
    outputs.upToDateWhen { false }
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('oie.') }
    // Engine jars first, harness classes and fixtures last, as in the container.
    classpath = engineJars + classpath
}

tasks.named('jar', Jar) {
    description = 'Assembles the smoke-test harness and its fixture resources.'
    from sourceSets.test.output
}

distributions {
    harness {
        contents {
            from(tasks.named('jar')) {
                into 'lib'
            }
            from(configurations.testRuntimeClasspath) {
                into 'lib'
            }
            from(rootProject.file('ci/run-harness.sh'))
        }
    }
}
