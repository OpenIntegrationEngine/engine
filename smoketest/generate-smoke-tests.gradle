import javax.inject.Inject

// Generates one static JUnit test class per fixture in ci/tests/.
tasks.register('generateSmokeTests', GenerateSmokeTests) {
    description = 'Generates static JUnit smoke tests and fixture resources from ci/tests.'
    fixturesRoot = rootProject.layout.projectDirectory.dir('ci/tests')
    generatedPackage = 'org.openintegrationengine.smoketest.cases'
    generatedSources = layout.buildDirectory.dir('generated/smoketest/java')
    generatedResources = layout.buildDirectory.dir('generated/smoketest/resources')
}

/**
 * Transforms the ci/tests fixture tree into static JUnit 5 sources plus the fixture
 * resources they load. The mapping mirrors the directory layout so the report reads
 * the same way: a class per test case, a @Nested class per channel with the channel's
 * deploy/undeploy as @BeforeAll/@AfterAll, and one ordered @Test per message.
 */
abstract class GenerateSmokeTests extends DefaultTask {

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getFixturesRoot()

    @Input
    abstract Property<String> getGeneratedPackage()

    @OutputDirectory
    abstract DirectoryProperty getGeneratedSources()

    @OutputDirectory
    abstract DirectoryProperty getGeneratedResources()

    @Inject
    abstract FileSystemOperations getFsOps()

    @TaskAction
    void generate() {
        File root = fixturesRoot.get().asFile
        File javaOut = generatedSources.get().asFile
        File resOut = generatedResources.get().asFile
        String pkg = generatedPackage.get()

        fsOps.delete { spec -> spec.delete(javaOut, resOut) }
        File pkgDir = new File(javaOut, pkg.replace('.', '/'))
        pkgDir.mkdirs()
        resOut.mkdirs()

        // TreeMap keyed by File gives deterministic, lexicographic case order.
        Map<File, List<File>> byCase = new TreeMap<>()
        root.traverse(type: groovy.io.FileType.FILES) { File file ->
            if (file.name != 'channel.xml') return
            File channelDir = file.parentFile
            File channelsDir = channelDir.parentFile
            if (channelsDir == null || channelsDir.name != 'channels') return
            byCase.computeIfAbsent(channelsDir.parentFile, { new ArrayList<File>() }).add(channelDir)
        }

        byCase.each { caseDir, channelDirs -> writeCase(root, resOut, pkgDir, pkg, caseDir, channelDirs.sort()) }
        logger.lifecycle("smoketest: generated ${byCase.size()} test case class(es) from ${root}")
    }

    void writeCase(File root, File resOut, File pkgDir, String pkg, File caseDir, List<File> channelDirs) {
        String className = 'Case_' + ident(caseDir.name) + '_Test'
        List<String> configurations = readConfigurations(caseDir)

        StringBuilder out = new StringBuilder()
        out << "// GENERATED by :smoketest:generateSmokeTests from ci/tests/${caseDir.name} -- DO NOT EDIT.\n"
        out << "// Edit the fixtures under ci/tests/${caseDir.name} and rebuild instead.\n"
        out << "package ${pkg};\n\n"
        out << "import static org.junit.jupiter.api.TestInstance.Lifecycle.PER_CLASS;\n\n"
        out << "import org.junit.jupiter.api.AfterAll;\n"
        out << "import org.junit.jupiter.api.BeforeAll;\n"
        out << "import org.junit.jupiter.api.DisplayName;\n"
        out << "import org.junit.jupiter.api.MethodOrderer;\n"
        out << "import org.junit.jupiter.api.Nested;\n"
        out << "import org.junit.jupiter.api.Order;\n"
        out << "import org.junit.jupiter.api.Test;\n"
        out << "import org.junit.jupiter.api.TestInstance;\n"
        out << "import org.junit.jupiter.api.TestMethodOrder;\n\n"
        out << "import org.openintegrationengine.smoketest.Harness;\n\n"
        out << "@DisplayName(${quote(caseDir.name)})\n"
        out << "class ${className} {\n"
        channelDirs.each { channelDir -> writeChannel(out, root, resOut, channelDir, configurations) }
        out << "}\n"

        new File(pkgDir, "${className}.java").setText(out.toString(), 'UTF-8')
    }

    void writeChannel(StringBuilder out, File root, File resOut, File channelDir, List<String> configurations) {
        File channelXml = new File(channelDir, 'channel.xml')
        String channelResource = 'fixtures/' + rel(root, channelXml)
        copyResource(channelXml, new File(resOut, channelResource))

        out << "\n    @Nested\n"
        out << "    @DisplayName(${quote(channelDir.name)})\n"
        out << "    @TestInstance(PER_CLASS)\n"
        out << "    @TestMethodOrder(MethodOrderer.OrderAnnotation.class)\n"
        out << "    class Channel_${ident(channelDir.name)} {\n\n"
        out << "        private String channelId;\n\n"
        out << "        @BeforeAll\n"
        out << "        void deploy() throws Exception {\n"
        if (!configurations.isEmpty()) {
            out << "            Harness.assumeConfiguration(${configurations.collect { quote(it) }.join(', ')});\n"
        }
        out << "            channelId = Harness.deploy(${quote(channelResource)});\n"
        out << "        }\n\n"
        out << "        @AfterAll\n"
        out << "        void undeploy() {\n"
        out << "            Harness.undeploy(channelId);\n"
        out << "        }\n"

        File messagesDir = new File(channelDir, 'messages')
        List<File> messageDirs = messagesDir.isDirectory() ?
                messagesDir.listFiles().findAll { it.isDirectory() }.sort() : []
        messageDirs.eachWithIndex { File messageDir, int index -> writeMessage(out, root, resOut, messageDir, index + 1) }

        out << "    }\n"
    }

    void writeMessage(StringBuilder out, File root, File resOut, File messageDir, int order) {
        File source = new File(messageDir, 'source')
        if (!source.isFile()) {
            throw new GradleException("Message fixture is missing its source payload: ${messageDir}")
        }
        boolean hasSourceMap = new File(messageDir, 'source_sourcemap.yml').isFile()
        String base = 'fixtures/' + rel(root, messageDir)

        List<String> assertionFiles = []
        messageDir.listFiles().findAll { it.isFile() }.sort().each { File file ->
            copyResource(file, new File(resOut, 'fixtures/' + rel(root, file)))
            if (file.name != 'source' && file.name != 'source_sourcemap.yml') {
                assertionFiles << file.name
            }
        }

        StringBuilder args = new StringBuilder("channelId, ${quote(base)}, ${hasSourceMap}")
        assertionFiles.each { args << ", ${quote(it)}" }

        out << "\n        @Test\n"
        out << "        @Order(${order})\n"
        out << "        @DisplayName(${quote(messageDir.name)})\n"
        out << "        void message_${ident(messageDir.name)}() throws Exception {\n"
        out << "            Harness.runMessage(${args});\n"
        out << "        }\n"
    }

    static List<String> readConfigurations(File caseDir) {
        File file = new File(caseDir, 'configurations')
        return file.isFile() ? file.readLines('UTF-8')*.trim().findAll { it && !it.startsWith('#') } : []
    }

    static void copyResource(File source, File destination) {
        destination.parentFile.mkdirs()
        destination.bytes = source.bytes
    }

    static String rel(File root, File file) {
        return root.toPath().relativize(file.toPath()).toString().replace('\\', '/')
    }

    /**
     * Turns a fixture directory name into the tail of a Java identifier. Every call site
     * prepends a letter-led prefix (Case_/Channel_/message_), so a name that starts with a
     * digit needs no further guarding here.
     */
    static String ident(String name) {
        return name.replaceAll('[^A-Za-z0-9]', '_')
    }

    /** Quotes a string as a Java string literal. Fixture paths and names have no newlines. */
    static String quote(String value) {
        return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
}